<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form results</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

<header class="app-header">
  <div class="container">
    <a href="/" class="app-logo">SimpleForm</a>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline btn-sm" id="btn-export" onclick="exportCSV()">Export CSV</button>
      <a id="btn-share" href="#" class="btn btn-primary btn-sm">Share form</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-header" style="display:flex; align-items:flex-start; justify-content:space-between;">
    <div>
      <h1 class="page-title" id="form-title">Loading...</h1>
      <p class="page-subtitle" id="responses-count"></p>
    </div>
  </div>

  <div id="responses-container">
    <div class="empty-state"><div class="spinner"></div></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/results.js"></script>
</body>
</html>
